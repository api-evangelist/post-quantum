name: Post-Quantum
description: Post-Quantum is a quantum-safe cybersecurity company founded in 2009 that
  protects critical infrastructure against both present-day threats and future quantum-computing
  attacks. Its platform spans Identity Protection, a hybrid post-quantum VPN standardized
  by the IETF as RFC 9370, and quantum-safe messaging, built on a crypto-agile modular
  architecture and NIST-round cryptography such as Classic McEliece. The company authored
  RFC 9370, delivered first-in-world quantum-safe drone communications, and its technology
  is deployed in NATO and active defense environments. The public web presence is a
  marketing and platform-overview site; no public developer API, SDK, documentation
  portal, or sign-up surface is published as of this enrichment pass.
